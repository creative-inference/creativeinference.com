<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Creative Inference</title>
    <meta name="description" content="Get in touch with the Creative Inference team to discuss your project.">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- =========== Header =========== -->
    <header class="main-header">
        <div class="container">
            <a href="index.html" class="nav-logo-text">Creative Inference</a>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About Us</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- =========== Page Header Section =========== -->
        <section class="page-header">
            <div class="container">
                <h1>Let's Build the Future, Together</h1>
                <p class="sub-headline">Have a project in mind or want to learn more? We'd love to hear from you.</p>
            </div>
        </section>

        <!-- =========== Contact Form Section =========== -->
        <section class="content-section">
            <div class="container form-container">
                <form action="#" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Send Message</button>
                </form>
            </div>
        </section>

    </main>

    <!-- =========== Footer =========== -->
    <footer class="main-footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                     <p>© 2025 Creative Inference. All Rights Reserved.</p>
                </div>
                <div class="footer-links">
                    <a href="#">LinkedIn</a>
                    <a href="#">Twitter</a>
                    <a href="contact.html">Contact</a>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
